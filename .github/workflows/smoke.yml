name: smoke
# After CI deploys the web build, load it in headless Chromium with a mode preset.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { query: 'modes=skate,portals', want: 'SKATE, PORTALS', world: 'City' }
          - { query: 'modes=jump,warfare,bullettime', want: 'JUMP, WARFARE, BULLET-TIME', world: 'City' }
          - { query: 'world=realm&modes=blocks', want: 'BLOCKS', world: 'Realm' }
          - { query: 'world=arena&modes=jump', want: 'JUMP', world: 'Arena' }
          - { query: 'time=night&modes=streets,swing', want: 'STREETS, SWING', world: 'City (night)' }
          # Tribute games: modes, world and time are fixed by the game, not the URL.
          - { game: blockrealm, want: 'BLOCKS', world: 'Realm' }
          - { game: hollow-warden, want: 'JUMP', world: 'Arena' }
          - { game: night-swing, want: 'STREETS, SWING', world: 'City (night)' }
          - { game: kickflip-ops, want: 'SKATE, WARFARE, BLOCKS', world: 'City' }
          - { game: block-city, want: 'STREETS, BLOCKS', world: 'City' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Load preset
        env:
          URL: https://andrewnakas.github.io/GameMash/${{ matrix.game || 'gamemash' }}/gl/?${{ matrix.query }}&panel=0
          WANT: ${{ matrix.want }}
          WANT_WORLD: ${{ matrix.world }}
        run: node .github/smoke/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ strategy.job-index }}
          path: smoke.png
