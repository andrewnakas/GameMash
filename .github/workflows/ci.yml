name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --locked

  web:
    # One job per game; they share the dependency cache, so only the game crate and link differ.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bin: [gamemash, blockrealm, hollow_warden, night_swing, kickflip_ops, block_city]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: ${{ matrix.bin == 'gamemash' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build WebGL2 and WebGPU variants
        run: scripts/build-web.sh ${{ matrix.bin }}
      - name: Sizes
        run: du -sh dist/*/gl dist/*/gpu && ls -la dist/*/gl/*.wasm dist/*/gpu/*.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.bin }}
          path: dist
          retention-days: 7

  pages:
    # Every game under one Pages site: /GameMash/<game>/ (dashes, e.g. /GameMash/night-swing/).
    # The web build ships even if a unit test is red; native releases still wait for tests.
    needs: web
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: web-*
          path: dist
          merge-multiple: true
      - name: Stage site
        run: |
          mkdir site
          for d in dist/*/; do b=$(basename "$d"); cp -r "$d" "site/${b//_/-}"; done
          printf '<meta http-equiv="refresh" content="0; url=gamemash/">' > site/index.html
          touch site/.nojekyll
          ls site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Zip web builds
        if: startsWith(github.ref, 'refs/tags/')
        run: for d in site/*/; do (cd "$d" && zip -qr "../../$(basename "$d")-web.zip" .); done
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: web-zips
          path: '*-web.zip'

  native:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, ext: '' }
          - { os: windows-latest, name: windows-x64, ext: .exe }
          - { os: macos-latest, name: macos-arm64, ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bins
      - name: Package each game
        shell: bash
        run: |
          for src in src/main.rs src/bin/*.rs; do
            b=$(basename "$src" .rs); [ "$b" = main ] && b=gamemash
            mkdir -p "pkg/$b"
            cp "target/release/$b${{ matrix.ext }}" "pkg/$b/"
            cp -r assets README.md "pkg/$b/"
            (cd pkg && 7z a -bd "../${b//_/-}-${{ matrix.name }}.zip" "$b" >/dev/null)
          done
          ls *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: '*.zip'

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [pages, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
